spring:
  application:
    name: srm-mcc-credit-assignment-api

  datasource:
    url: jdbc:h2:mem:creditdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

security:
  jwt:
    # Dev-only fallback secret — MUST be overridden via JWT_SECRET in any real environment.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

logging:
  level:
    com.srm.mcc.credit: DEBUG
    org.hibernate.SQL: WARN
