# AWS RDS production profile
# Activate with: --spring.profiles.active=prod
#
# The datasource itself is NOT configured here — see
# com.srm.mcc.credit.infrastructure.config.RdsIamDataSourceConfig, which builds a HikariCP pool
# backed by a custom DataSource that authenticates with a fresh AWS IAM token (15-min TTL) on
# every physical connection. No static DB password is ever stored or exported.
#
# Required environment variables:
#   RDSHOST     - RDS endpoint (e.g. database-2-instance-1.xxxx.sa-east-1.rds.amazonaws.com)
#   JWT_SECRET  - HMAC-SHA256 signing secret for JWT access tokens (>= 32 random bytes).
#                 No default is provided here on purpose: the app MUST fail to start in
#                 production if this is missing, rather than fall back to an insecure value.
#
# Optional environment variables (defaults shown):
#   DB_PORT       5432
#   DB_NAME       postgres
#   DB_USERNAME   postgres
#   DB_SSL_MODE   require        (use 'disable' only for local dev without SSL)
#   AWS_REGION    sa-east-1
#   DB_POOL_MAX   10
#   DB_POOL_MIN   2
#   JWT_EXPIRATION_MS  3600000   (1 hour)
#   CORS_ALLOWED_ORIGINS  https://main.dtl1imugj23qi.amplifyapp.com  (comma-separated front-end origins)
#
# AWS credentials used to sign the IAM auth token come from the SDK default credential chain
# (instance profile / ECS task role / EKS service account / env vars) — never hardcoded.
spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  h2:
    console:
      enabled: false

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

app:
  cors:
    # Front-end origin(s) allowed to call this API in production (e.g. AWS Amplify app URL).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://main.dtl1imugj23qi.amplifyapp.com}

